  <div class="shell">

    <main class="stage">
      <section class="view active pad" id="v1"><div class="eyebrow">M.LEAGUE DRAFT ROOM</div><h1 class="title">指名するチームを<br><span>選択してください</span></h1><div class="teams" id="teams"></div></section>

      <section class="view" id="v4"><div id="revealHost"></div><div class="actions" id="actions" hidden><button class="edit" id="editPlayers" hidden>選手情報を修正</button><button class="replay" id="replay">最初から再生 ↻</button><button class="restart" id="restart">新しい指名を作成</button></div></section>
    </main>
    <footer class="foot"><span>© M DRAFT SIMULATOR</span><p>※ 入力内容は保存・送信されません。</p><p>※ 本サイトは非公式のファンメイド・シミュレーターです。Mリーグ機構および各チームとは関係ありません。</p></footer>

    const teamData=[["EARTH JETS",

    const customOrg='その他（自由入力）',

"日本プロ麻雀協会",
"RMU",

customOrg],
$=s=>document.querySelector(s),
$$=s=>document.querySelectorAll(s);
let team=null,
pickCount=1,
candidates=[],

    const orgName=c=>c.org===customOrg?c.customOrg.trim():c.org;
    const customForm=document.createElement('form');
customForm.className='team customteam';
customForm.style.setProperty('--c',
'#008653');

'#e22b32');
customForm.innerHTML=`<span class="teamlogo" style="--scale:1.1628225"><img src="team-logos/m-league.png" alt=""></span><label class="customname"><span>カスタムチーム</span><input maxlength="24" placeholder="チーム名を入力" aria-label="自選チーム名"></label><button class="customsubmit" type="submit" disabled>→</button>`;
customForm.oninput=()=>customForm.querySelector('button').disabled=!customForm.querySelector('input').value.trim();
customForm.onsubmit=e=>{
e.preventDefault();
const name=customForm.querySelector('input').value.trim();
if(name)chooseTeam([name,
'CUSTOM TEAM',
'M',
'#008653',
'#e22b32',
'team-logos/m-league.png',
1.1628225])}
;
$('#teams').appendChild(customForm);
    teamData.forEach(t=>{
const b=document.createElement("button");
b.className="team";
b.style.setProperty("--c",
t[3]);
b.style.setProperty("--c2",
t[4]);
b.innerHTML=`<span class="teamlogo" style="--scale:${t[6]}"><img src="${t[5]}" alt=""></span><span class="teamtitle"><strong>${t[0]}</strong></span><span class="arrow">↗</span>`;
b.onclick=()=>chooseTeam(t);
$("#teams").appendChild(b)}
);
$("#teams").appendChild(customForm);
    [1,
2,
3,
4].forEach(n=>{
const b=document.createElement("button");
b.className="count";
b.innerHTML=`<strong>${n}</strong><span>${n}名を指名</span><i>→</i>`;
b.onclick=()=>chooseCount(n);
$("#counts").appendChild(b)}
);
    function show(n){
currentStep=n;
$$('.view').forEach((v,
i)=>v.classList.toggle('active',
i===n-1));
$$('.step').forEach((s,
i)=>{
s.classList.toggle('active',
i<n);
s.classList.toggle('backable',
i<n-1);
s.disabled=i>=n-1;
s.querySelector('i').textContent=i<n-1?'✓':i+1}
)}
    function goBack(n){
if(n>=currentStep)return;
clearTimeout(timer);
playing=false;
$('#actions').hidden=true;
show(n)}
    function setTeamStyle(){
document.documentElement.style.setProperty('--team',
team[3]);
document.documentElement.style.setProperty('--team2',
team[4]);
$$('.selectedLogo').forEach(x=>x.style.setProperty('--scale',
team[6]));
$$('.selectedLogo img').forEach(x=>x.src=team[5]);
$$('.selectedName').forEach(x=>x.textContent=team[0])}
    function chooseTeam(t){
team=t;
setTeamStyle();
show(2)}
    function chooseCount(n){
pickCount=n;
candidates=Array.from({
length:n}
,
()=>({
name:'',
org:'',
customOrg:''}
));
$("#countTitle").textContent=n;
$("#pickLabel").textContent='指名 '+n+'名';
renderPlayers();
show(3);
setTimeout(()=>$('#players input').focus(),
80)}
    function renderPlayers(){
$('#players').innerHTML=candidates.map((c,
i)=>`<div class="player"><div class="order"><b>${String(i+1).padStart(2,
'0')}</b></div><label class="field orgfield"><span>所属団体</span><select required data-i="${i}" data-f="org"><option value="" disabled${c.org===''?' selected':''}>所属団体を選択</option>${orgs.map(o=>`<option${o===c.org?' selected':''}>${o}</option>`).join('')}</select>${c.org===customOrg?`<input class="customorg" data-i="${i}" data-f="customOrg" maxlength="30" placeholder="所属団体を入力" aria-label="所属団体を自由入力" autocomplete="off">`:''}</label><label class="field"><span>選手名</span><input data-i="${i}" data-f="name" maxlength="30" placeholder="例：山田 太郎" autocomplete="off"></label></div>`).join('');
$('#players').oninput=update;
$('#players').onchange=update}
    function update(e){
const i=+e.target.dataset.i,
f=e.target.dataset.f;
if(!f)return;
candidates[i][f]=e.target.value;
if(f==='org'){
const field=e.target.closest('.orgfield'),
old=field.querySelector('.customorg');
if(e.target.value===customOrg&&!old){
const input=document.createElement('input');
input.className='customorg';
input.dataset.i=i;
input.dataset.f='customOrg';
input.maxLength=30;
input.placeholder='所属団体を入力';
input.setAttribute('aria-label',
'所属団体を自由入力');
input.autocomplete='off';
field.appendChild(input);
input.focus()}
else if(e.target.value!==customOrg&&old){
old.remove();
candidates[i].customOrg=''}
}
$('#submit').disabled=!candidates.every(c=>c.name.trim()&&orgName(c))}
    function start(){
clearTimeout(timer);
index=0;
playing=true;
sequence++;
$('#actions').hidden=true;
$('#editPlayers').hidden=true;
show(4);
renderIntro()}
    function bindAdvance(){
const page=$('.manual');
page.onclick=advance;
page.onkeydown=e=>{
if(e.key==='Enter'||e.key===' '){
e.preventDefault();
advance()}
}
}
    function advance(){
if(!playing)return;
if($('.teamintro')){
renderReveal();
return}
if(index<pickCount-1){
index++;
renderReveal();
return}
playing=false;
renderSummary();
$('#actions').hidden=false}
    function renderIntro(){
$('#revealHost').innerHTML=`<div class="teamintro manual" role="button" tabindex="0"><div class="topline"></div><div class="live" role="img" aria-label="LIVE"></div><div class="teamintrocopy"><h1>選択希望選手 発表</h1></div><div class="teamintrocenter"><span class="intrologo" style="--scale:${team[6]*1.5}"><img src="${team[5]}" alt=""></span></div><div class="clicknext">クリックして発表を開始 <b>→</b></div></div>`;
bindAdvance()}
    function renderReveal(){
$('#editPlayers').hidden=true;
const c=candidates[index],
dots=candidates.map((x,
i)=>`<button class="${i===index?'on':i<index?'past':''}" ${playing?'disabled':''} data-index="${i}"><span>${i+1}</span><i></i></button>`).join(''),
hint=index<pickCount-1?'クリックして次の指名へ':'クリックして指名一覧へ';
$('#revealHost').innerHTML=`<div class="reveal ${playing?'manual':''}" ${playing?'role="button" tabindex="0"':''} key="${sequence}-${index}"><div class="topline"></div><div class="meta"><p class="org">${orgName(c)}</p></div><div class="live" role="img" aria-label="LIVE"></div><h1>${c.name.trim()}</h1><div class="revealteam"><span class="reveallogo" style="--scale:${team[6]*2}"><img src="${team[5]}" alt=""></span></div><div class="track">${dots}</div>${playing?`<div class="clicknext">${hint} <b>→</b></div>`:''}</div>`;
$$('.track button').forEach(b=>b.onclick=()=>{
if(!playing){
index=+b.dataset.index;
renderReveal()}
}
);
if(playing)bindAdvance()}
    function renderSummary(){
$('#editPlayers').hidden=false;
const cards=candidates.map((c,
i)=>`<button class="summaryitem" data-index="${i}"><strong>${String(i+1).padStart(2,
'0')}</strong><span><small>${orgName(c)}</small><b>${c.name.trim()}</b></span><em>個別表示 ↗</em></button>`).join('');

$$('.summaryitem').forEach(b=>b.onclick=()=>{
index=+b.dataset.index;
renderReveal()}
)}

team=null;
pickCount=1;

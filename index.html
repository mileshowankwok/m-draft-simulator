<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>M DRAFT SIMULATOR｜Mリーグ指名シミュレーター</title>
  <meta name="description" content="1〜4名のMリーグ風指名発表を連続再生できる非公式シミュレーター">

  <style>
    :root {
      --ink: #111713;
      --muted: #6f7b73;
      --green: #0b7a49;
      --pale: #eaf6ef;
      --line: #c8ded1;
      --team: #0b7a49;
      --team2: #174d36;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: #f4f8f5;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
      background:
        linear-gradient(rgba(10, 104, 62, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(10, 104, 62, .035) 1px, transparent 1px),
        #f4f8f5;
      background-size: 46px 46px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top {
      height: 76px;
      padding: 0 clamp(18px, 5vw, 68px);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .92);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      border: 0;
      background: none;
      cursor: pointer;
      text-align: left;
    }

    .brand .brandlogo {
      width: 54px;
      height: 54px;
      display: block;
      background: none;
      box-shadow: none;
      transform: none;
    }

    .brandlogo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand > span {
      display: block;
    }

    .brand b {
      display: block;
      font-size: 18px;
      letter-spacing: .12em;
    }

    .steps {
      width: min(830px, calc(100% - 30px));
      margin: 25px auto 19px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      position: relative;
    }

    .steps::before {
      content: "";
      position: absolute;
      left: 12.5%;
      right: 12.5%;
      top: 16px;
      height: 1px;
      background: #cadbd1;
    }

    .step {
      z-index: 1;
      padding: 0;
      border: 0;
      appearance: none;
      text-align: center;
      color: #98a29c;
      background: transparent;
      font-family: inherit;
      font-size: 10px;
      font-weight: 750;
      cursor: default;
    }

    .step:disabled {
      opacity: 1;
    }

    .step i {
      width: 33px;
      height: 33px;
      margin: 0 auto 7px;
      display: grid;
      place-items: center;
      border: 1px solid #cad9d0;
      border-radius: 50%;
      background: #f4f8f5;
      font-style: normal;
    }

    .step.active {
      color: #243029;
    }

    .step.active i {
      border-color: var(--green);
      background: var(--green);
      box-shadow: 0 0 0 5px rgba(11, 122, 73, .09);
      color: #fff;
    }

    .step.backable {
      cursor: pointer;
    }

    .step.backable:hover i,
    .step.backable:focus-visible i {
      transform: translateY(-2px);
      box-shadow: 0 0 0 6px rgba(11, 122, 73, .14);
    }

    .stage {
      width: min(1180px, calc(100% - 34px));
      min-height: 570px;
      margin: 0 auto;
      position: relative;
      flex: 1;
      overflow: hidden;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .97);
      box-shadow: 0 24px 70px rgba(20, 75, 45, .08);
    }

    .view {
      display: none;
      min-height: 570px;
      animation: view-in .38s ease;
    }

    .view.active {
      display: block;
    }

    .pad {
      padding: clamp(27px, 4.5vw, 54px);
    }

    .eyebrow {
      color: var(--green);
      font-size: 18px;
      font-weight: 900;
      letter-spacing: .3em;
    }

    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 22px;
      height: 2px;
      margin-right: 8px;
      background: var(--green);
      vertical-align: middle;
    }

    .title {
      margin: 13px 0 8px;
      font-size: clamp(31px, 4vw, 52px);
      line-height: 1.1;
      letter-spacing: -.055em;
    }

    .title span {
      color: #111713;
      -webkit-text-stroke: 0;
    }

    .back,
    .resultback {
      padding: 0;
      border: 0;
      background: none;
      color: #68756d;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .teams {
      margin-top: 29px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .team {
      min-height: 170px;
      padding: 16px 14px 15px;
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: 1fr auto;
      position: relative;
      overflow: hidden;
      border: 1px solid #dbe6df;
      background: #fff;
      text-align: left;
      cursor: pointer;
      transition: .22s;
    }

    .team::before {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 4px;
      background: var(--green);
    }

    .team:hover,
    .team:focus {
      outline: 0;
      transform: translateY(-4px);
      border-color: var(--green);
      box-shadow: 0 12px 26px rgba(16, 91, 56, .1);
    }

    .teamlogo {
      grid-column: 1 / 3;
      width: 100%;
      height: 88px;
      padding: 3px 10px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .teamlogo img,
    .selectedLogo img,
    .intrologo img,
    .reveallogo img,
    .summarylogo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: scale(var(--scale, 1));
      transform-origin: center;
    }

    .teamtitle {
      min-width: 0;
      align-self: end;
    }

    .teamtitle strong {
      font-size: 13px;
      line-height: 1.22;
      font-weight: 850;
      white-space: normal;
    }

    .arrow {
      align-self: end;
      color: #789083;
    }

    .customteam {
      cursor: default;
    }

    .customteam .teamlogo {
      transform: translateY(10px);
    }

    .customname {
      min-width: 0;
      align-self: end;
      display: flex;
      flex-direction: column;
    }

    .customname > span {
      position: absolute;
      top: 14px;
      left: 14px;
      color: var(--green);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .12em;
    }

    .customname input {
      width: 100%;
      min-width: 0;
      padding: 3px 0 5px;
      border: 0;
      border-bottom: 1px solid #b9d0c2;
      border-radius: 0;
      outline: 0;
      color: #111713;
      background: transparent;
      font-size: 12px;
      font-weight: 750;
      transform: translateY(7px);
    }

    .customname input:focus {
      border-color: var(--green);
    }

    .customsubmit {
      width: 32px;
      height: 32px;
      padding: 0;
      align-self: end;
      display: grid;
      place-items: center;
      border: 0;
      color: #fff;
      background: var(--green);
      font-weight: 900;
      cursor: pointer;
      transform: translateY(7px);
    }

    .customsubmit:disabled {
      opacity: .28;
      cursor: default;
    }

    .heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 25px;
    }

    .teamchip {
      min-width: 230px;
      margin: 0 26px -12px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .selectedLogo {
      width: 208px;
      height: 148px;
      display: block;
      flex: 0 0 auto;
    }

    .counts {
      margin-top: 25px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 13px;
    }

    .count {
      min-height: 220px;
      padding: 21px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      position: relative;
      border: 1px solid #cfe0d6;
      background: #fbfdfc;
      cursor: pointer;
      transition: .22s;
    }

    .count:hover,
    .count:focus {
      outline: 0;
      transform: translateY(-5px);
      border-color: var(--green);
      box-shadow: 0 15px 28px rgba(19, 103, 64, .1);
    }

    .count strong {
      margin: 16px 0 0;
      color: var(--green);
      font-size: 88px;
      line-height: 1;
      font-weight: 950;
      letter-spacing: -.08em;
    }

    .count span {
      margin-top: 10px;
      font-size: 18px;
      font-weight: 850;
      transform: translateY(4px);
    }

    .count i {
      margin-top: auto;
      align-self: flex-end;
      color: var(--green);
      font-style: normal;
    }

    .entryhead {
      position: relative;
      padding-right: 350px;
    }

    .entryhead > .back {
      display: block;
      margin-bottom: 24px;
    }

    .entrychip {
      min-width: 230px;
      position: absolute;
      right: 28px;
      bottom: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .entrychip span {
      color: var(--green);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .players {
      border-top: 1px solid var(--line);
    }

    .player {
      display: grid;
      grid-template-columns: 65px minmax(220px, .9fr) minmax(260px, 1.1fr);
      align-items: end;
      gap: 18px;
      padding: 17px 0;
      border-bottom: 1px solid #dce8e0;
    }

    .order {
      min-height: 49px;
      height: auto;
      padding-right: 14px;
      align-self: stretch;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 2px solid var(--green);
    }

    .order b {
      color: var(--green);
      font-size: 28px;
      line-height: 1;
    }

    .field span {
      display: block;
      margin-bottom: 7px;
      color: #637068;
      font-size: 10px;
      font-weight: 750;
    }

    .field input,
    .field select {
      width: 100%;
      height: 49px;
      padding: 0 13px;
      border: 1px solid #cddbd2;
      border-radius: 0;
      outline: 0;
      color: #131a15;
      background: #fff;
      font-size: 12px;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(11, 122, 73, .09);
    }

    .field input::placeholder,
    .field select:invalid {
      color: #969d99;
      opacity: 1;
    }

    .field select option {
      color: #131a15;
    }

    .orgfield {
      display: grid;
    }

    .field .customorg {
      height: 49px;
      margin-top: 8px;
      border-color: var(--green);
    }

    .formfoot {
      margin-top: 21px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 22px;
    }

    .submit {
      width: 280px;
      height: 55px;
      padding: 0 18px;
      border: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
      background: var(--green);
      box-shadow: 7px 7px #c2dfcf;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .submit:disabled {
      opacity: .3;
      cursor: not-allowed;
    }

    .reveal,
    .summary,
    .teamintro {
      min-height: 640px;
      position: relative;
      overflow: hidden;
      background: #fff url("draft-bg.png") center / cover no-repeat;
      animation: reveal-in .55s ease;
    }

    .reveal {
      padding: clamp(43px, 6vw, 75px) clamp(38px, 8vw, 100px) 64px;
      display: flex;
      flex-direction: column;
    }

    .teamintro {
      padding: clamp(43px, 6vw, 75px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .summary {
      padding: clamp(34px, 5vw, 62px);
      display: flex;
      flex-direction: column;
    }

    .topline {
      position: absolute;
      z-index: 3;
      top: 0;
      right: 0;
      left: 0;
      height: 7px;
      background: linear-gradient(90deg, var(--green) 0 72%, #b8dac7 72%);
    }

    .live {
      width: clamp(90px, 9vw, 120px);
      aspect-ratio: 3 / 1;
      padding: 0;
      position: absolute;
      z-index: 3;
      top: 7%;
      right: 4%;
      overflow: hidden;
      background: url("live-logo.png") center / 112% auto no-repeat;
      color: transparent;
      font-size: 0;
    }

    .teamintrocopy {
      position: absolute;
      top: clamp(44px, 7vw, 78px);
      left: clamp(38px, 8vw, 100px);
    }

    .teamintrocopy h1 {
      margin: 7px 0 0;
      font-family: inherit;
      font-size: clamp(17px, 2.4vw, 31px);
      font-weight: 600;
      letter-spacing: 0;
    }

    .teamintrocenter {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: intro-mark 1s .2s ease both;
    }

    .intrologo {
      width: clamp(216px, 31.2vw, 372px);
      height: clamp(144px, 21.6vw, 246px);
      display: block;
    }

    .meta {
      position: relative;
      z-index: 2;
    }

    .org {
      margin: 8px 0 0;
      position: relative;
      z-index: 2;
      font-family: inherit;
      font-size: clamp(24px, 3.36vw, 43px);
      font-weight: 600;
      letter-spacing: 0;
    }

    .reveal h1 {
      width: calc(105% - clamp(44px, 12vw, 180px));
      max-width: none;
      margin: 0;
      position: absolute;
      z-index: 2;
      top: 47%;
      left: 50%;
      color: #050705;
      font-family: inherit;
      font-size: clamp(76px, 13.17vw, 167px);
      line-height: 1.04;
      font-weight: 720;
      letter-spacing: 0;
      text-align: center;
      word-break: keep-all;
      animation: name-center .8s ease;
    }

    .revealteam {
      min-width: 0;
      margin: auto auto 0;
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
    }

    .reveallogo {
      width: 180px;
      height: 101px;
      display: block;
    }

    .track {
      position: absolute;
      z-index: 4;
      bottom: 23px;
      left: 4%;
      display: flex;
      gap: 7px;
    }

    .track button {
      width: 44px;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
    }

    .track button:disabled {
      cursor: default;
    }

    .track span {
      display: block;
      margin-bottom: 5px;
      color: #9ba59f;
      text-align: left;
      font-size: 10px;
    }

    .track i {
      display: block;
      height: 3px;
      background: #dce5df;
    }

    .track .on i,
    .track .past i {
      background: var(--green);
    }

    .manual {
      cursor: pointer;
      outline: 0;
    }

    .manual:focus-visible {
      box-shadow: inset 0 0 0 3px var(--green);
    }

    .clicknext {
      position: absolute;
      z-index: 6;
      right: 4%;
      bottom: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--green);
      font-size: 14px;
      font-weight: 850;
      pointer-events: none;
    }

    .clicknext b {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--green);
    }

    .summaryhead {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 28px;
      padding-bottom: 23px;
      border: 0;
    }

    .summaryhead h1 {
      margin: 9px 0 4px;
      font-size: clamp(38px, 5vw, 64px);
      letter-spacing: -.06em;
    }

    .summaryteam {
      min-width: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .summarylogo {
      width: 252px;
      height: 168px;
      display: block;
      flex: 0 0 auto;
    }

    .summarygrid {
      width: 100%;
      max-width: 980px;
      margin: auto;
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .summarygrid.picks-1 .summaryitem {
      grid-column: 1 / 3;
      width: calc(50% - 6px);
      justify-self: center;
    }

    .summaryitem {
      min-height: 125px;
      padding: 19px;
      position: relative;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      border: 1px solid #d4e2d9;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .summaryitem:hover {
      border-color: var(--green);
      box-shadow: 0 12px 25px rgba(14, 89, 53, .09);
    }

    .summaryitem > strong {
      padding-right: 10px;
      border-right: 1px solid #c8dcd0;
      color: var(--green);
      font-size: 25px;
    }

    .summaryitem span {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .summaryitem small {
      overflow: hidden;
      color: #111713;
      font-family: inherit;
      font-size: clamp(15px, 1.8vw, 22px);
      font-weight: 600;
      letter-spacing: 0;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .summaryitem b {
      margin-top: 7px;
      overflow: hidden;
      color: #050705;
      font-family: inherit;
      font-size: clamp(23px, 3vw, 37px);
      font-weight: 720;
      letter-spacing: 0;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .summaryitem em {
      position: absolute;
      right: 16px;
      bottom: 12px;
      color: var(--green);
      font-size: 10px;
      font-style: normal;
    }

    .actions {
      min-height: 70px;
      padding: 11px 22px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 11px;
      border: 0;
      background: #f7faf8;
    }

    .actions button {
      min-height: 39px;
      padding: 0 14px;
      border: 0;
      background: none;
      color: #66736b;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .actions .edit {
      color: var(--green);
      background: var(--pale);
    }

    .actions .replay {
      border: 1px solid #afcdbb;
      color: var(--green);
      background: #fff;
    }

    .actions .restart {
      color: #fff;
      background: var(--green);
    }

    .foot {
      width: min(1180px, calc(100% - 34px));
      margin: 19px auto 25px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      color: #7f8d84;
      font-size: 10px;
    }

    .foot p {
      margin: 0;
      text-align: left;
    }

    @keyframes view-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
    }

    @keyframes reveal-in {
      from {
        opacity: 0;
        filter: brightness(1.5);
      }
    }

    @keyframes name-center {
      from {
        opacity: 0;
        transform: translate(-50%, calc(-50% + 30px));
        clip-path: inset(0 100% 0 0);
      }

      to {
        transform: translate(-50%, -50%);
        clip-path: inset(0);
      }
    }

    @keyframes intro-mark {
      from {
        opacity: 0;
        transform: scale(.72);
        filter: blur(8px);
      }

      to {
        opacity: 1;
        transform: none;
        filter: none;
      }
    }

    @media (max-width: 850px) {
      .teams {
        grid-template-columns: repeat(2, 1fr);
      }

      .counts {
        grid-template-columns: repeat(2, 1fr);
      }

      .player {
        grid-template-columns: 55px 1fr 1fr;
      }

      .entryhead {
        padding-right: 0;
      }

      .entrychip {
        position: static;
        width: fit-content;
        margin: 0 auto 20px;
      }
    }

    @media (max-width: 560px) {
      .top {
        height: 66px;
      }

      .brand .brandlogo {
        width: 44px;
        height: 44px;
      }

      .brand b {
        font-size: 15px;
      }

      .steps {
        width: calc(100% - 16px);
      }

      .step {
        font-size: 7px;
      }

      .stage {
        width: calc(100% - 20px);
      }

      .pad {
        padding: 25px 16px;
      }

      .heading {
        display: block;
      }

      .teamchip {
        min-width: 0;
        margin: 20px auto;
      }

      .selectedLogo {
        width: 160px;
        height: 114px;
      }

      .count {
        min-height: 145px;
        padding: 15px;
      }

      .count strong {
        font-size: 55px;
      }

      .entrychip {
        min-width: 0;
      }

      .player {
        grid-template-columns: 45px 1fr;
        align-items: start;
      }

      .order {
        grid-row: 1 / 3;
        height: 100%;
      }

      .field {
        grid-column: 2;
      }

      .formfoot {
        flex-direction: column;
        align-items: stretch;
      }

      .submit {
        width: 100%;
      }

      .teamintro,
      .reveal {
        min-height: 585px;
      }

      .teamintro {
        padding: 38px 21px;
      }

      .teamintrocopy {
        top: 38px;
        left: 21px;
      }

      .reveal {
        padding: 38px 21px 64px;
      }

      .org {
        max-width: 76%;
        font-size: 16px;
      }

      .reveal h1 {
        width: calc(105% - 38px);
        font-size: clamp(61px, 19.38vw, 91px);
        line-height: 1.08;
      }

      .reveallogo {
        width: 144px;
        height: 82px;
      }

      .summary {
        padding: 28px 17px;
      }

      .summaryhead {
        display: block;
      }

      .summaryteam {
        min-width: 0;
        margin-top: 17px;
      }

      .summarylogo {
        width: 190px;
        height: 127px;
      }

      .summarygrid {
        grid-template-columns: 1fr;
        margin: 23px 0;
      }

      .summarygrid.picks-1 .summaryitem {
        grid-column: auto;
        width: 100%;
      }

      .summaryitem {
        min-height: 102px;
        padding: 14px;
        grid-template-columns: 45px 1fr;
      }

      .summaryitem em {
        display: none;
      }

      .summaryitem b {
        font-size: 25px;
      }

      .actions {
        flex-wrap: wrap;
      }

      .foot {
        width: calc(100% - 28px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="shell">
    <header class="top">
      <button class="brand" id="home">
        <i class="brandlogo">
          <img src="team-logos/m-league.png" alt="M.LEAGUE">
        </i>
        <span><b>DRAFT SIMULATOR</b></span>
      </button>
    </header>

    <nav class="steps" aria-label="指名ステップ">
      <button type="button" class="step active" data-step="1" disabled>
        <i>1</i>チーム選択
      </button>
      <button type="button" class="step" data-step="2" disabled>
        <i>2</i>指名人数
      </button>
      <button type="button" class="step" data-step="3" disabled>
        <i>3</i>選手情報
      </button>
      <button type="button" class="step" data-step="4" disabled>
        <i>4</i>指名発表
      </button>
    </nav>

    <main class="stage">
      <section class="view active pad" id="v1">
        <div class="eyebrow">M.LEAGUE DRAFT ROOM</div>
        <h1 class="title">
          指名するチームを<br>
          <span>選択してください</span>
        </h1>
        <div class="teams" id="teams"></div>
      </section>

      <section class="view pad" id="v2">
        <button class="back" data-go="1">← チーム選択へ戻る</button>

        <div class="heading">
          <div>
            <div class="eyebrow" style="margin-top:25px">NUMBER OF PICKS</div>
            <h1 class="title">
              指名する人数を<br>
              <span>選択してください</span>
            </h1>
          </div>

          <div class="teamchip">
            <span class="selectedLogo"><img alt=""></span>
          </div>
        </div>

        <div class="counts" id="counts"></div>
      </section>

      <section class="view pad" id="v3">
        <div class="entryhead">
          <button class="back" data-go="2">← 指名人数を変更</button>
          <div class="eyebrow">PLAYER ENTRY</div>

          <h1 class="title">
            <b id="countTitle"></b>名の指名選手を<br>
            <span>入力してください</span>
          </h1>

          <div class="entrychip">
            <span class="selectedLogo"><img alt=""></span>
            <span id="pickLabel"></span>
          </div>
        </div>

        <form id="form">
          <div class="players" id="players"></div>

          <div class="formfoot">
            <button class="submit" id="submit" disabled>
              <span>指名発表を開始する</span>
              <b>→</b>
            </button>
          </div>
        </form>
      </section>

      <section class="view" id="v4">
        <div id="revealHost"></div>

        <div class="actions" id="actions" hidden>
          <button class="edit" id="editPlayers" hidden>選手情報を修正</button>
          <button class="replay" id="replay">最初から再生 ↻</button>
          <button class="restart" id="restart">新しい指名を作成</button>
        </div>
      </section>
    </main>

    <footer class="foot">
      <span>© M DRAFT SIMULATOR</span>
      <p>※ 入力内容は保存・送信されません。</p>
      <p>※ 本サイトは非公式のファンメイド・シミュレーターです。Mリーグ機構および各チームとは関係ありません。</p>
    </footer>
  </div>

  <script>
    const teamData = [
      [
        "EARTH JETS",
        "アースジェッツ",
        "EJ",
        "#22b8bd",
        "#173f72",
        "team-logos/earth-jets.png",
        1.122
      ],
      [
        "赤坂ドリブンズ",
        "AKASAKA DRIVENS",
        "AD",
        "#e72734",
        "#171717",
        "team-logos/akasaka-drivens.png",
        .84
      ],
      [
        "EX風林火山",
        "EX FURINKAZAN",
        "EX",
        "#b8212d",
        "#d2a331",
        "team-logos/ex-furinkazan.svg",
        .946
      ],
      [
        "KADOKAWAサクラナイツ",
        "SAKURA KNIGHTS",
        "KS",
        "#e67bb3",
        "#31215e",
        "team-logos/kadokawa-sakura-knights.png",
        .924
      ],
      [
        "KONAMI 麻雀格闘倶楽部",
        "MAHJONG FIGHT CLUB",
        "KF",
        "#c4112f",
        "#d7a92d",
        "team-logos/konami-mahjong-fight-club.png",
        1.55232
      ],
      [
        "渋谷ABEMAS",
        "SHIBUYA ABEMAS",
        "SA",
        "#e2b719",
        "#151515",
        "team-logos/shibuya-abemas.svg",
        .891156
      ],
      [
        "セガサミーフェニックス",
        "SEGA SAMMY PHOENIX",
        "SS",
        "#f17a21",
        "#151515",
        "team-logos/sega-sammy-phoenix.svg",
        .78
      ],
      [
        "TEAM RAIDEN / 雷電",
        "TEAM RAIDEN",
        "TR",
        "#dcbf18",
        "#171717",
        "team-logos/team-raiden.svg",
        .72168
      ],
      [
        "BEAST X",
        "BEAST X",
        "BX",
        "#1670bc",
        "#ef3e33",
        "team-logos/beast-x.png",
        .924
      ],
      [
        "U-NEXT Pirates",
        "U-NEXT PIRATES",
        "UP",
        "#04a99d",
        "#132443",
        "team-logos/unext-pirates.svg",
        1.0143
      ]
    ];

    const customOrg = "その他（自由入力）";

    const orgs = [
      "日本プロ麻雀連盟",
      "最高位戦日本プロ麻雀協会",
      "日本プロ麻雀協会",
      "RMU",
      "麻将連合",
      customOrg
    ];

    const $ = selector => document.querySelector(selector);
    const $$ = selector => document.querySelectorAll(selector);

    let team = null;
    let pickCount = 1;
    let candidates = [];
    let index = 0;
    let timer = null;
    let playing = false;
    let sequence = 0;
    let currentStep = 1;

    const orgName = candidate =>
      candidate.org === customOrg
        ? candidate.customOrg.trim()
        : candidate.org;

    const customForm = document.createElement("form");

    customForm.className = "team customteam";
    customForm.style.setProperty("--c", "#008653");
    customForm.style.setProperty("--c2", "#e22b32");

    customForm.innerHTML = `
      <span class="teamlogo" style="--scale:1.1628225">
        <img src="team-logos/m-league.png" alt="">
      </span>

      <label class="customname">
        <span>カスタムチーム</span>
        <input
          maxlength="24"
          placeholder="チーム名を入力"
          aria-label="自選チーム名"
        >
      </label>

      <button
        class="customsubmit"
        type="submit"
        disabled
        aria-label="自選チームを選択"
      >→</button>
    `;

    customForm.oninput = () => {
      const input = customForm.querySelector("input");
      const button = customForm.querySelector("button");
      button.disabled = !input.value.trim();
    };

    customForm.onsubmit = event => {
      event.preventDefault();

      const name = customForm.querySelector("input").value.trim();

      if (name) {
        chooseTeam([
          name,
          "CUSTOM TEAM",
          "M",
          "#008653",
          "#e22b32",
          "team-logos/m-league.png",
          1.1628225
        ]);
      }
    };

    teamData.forEach(teamItem => {
      const button = document.createElement("button");

      button.className = "team";
      button.style.setProperty("--c", teamItem[3]);
      button.style.setProperty("--c2", teamItem[4]);

      button.innerHTML = `
        <span class="teamlogo" style="--scale:${teamItem[6]}">
          <img src="${teamItem[5]}" alt="">
        </span>

        <span class="teamtitle">
          <strong>${teamItem[0]}</strong>
        </span>

        <span class="arrow">↗</span>
      `;

      button.onclick = () => chooseTeam(teamItem);
      $("#teams").appendChild(button);
    });

    $("#teams").appendChild(customForm);

    [1, 2, 3, 4].forEach(number => {
      const button = document.createElement("button");

      button.className = "count";

      button.innerHTML = `
        <strong>${number}</strong>
        <span>${number}名を指名</span>
        <i>→</i>
      `;

      button.onclick = () => chooseCount(number);
      $("#counts").appendChild(button);
    });

    function show(stepNumber) {
      currentStep = stepNumber;

      $$(".view").forEach((view, viewIndex) => {
        view.classList.toggle("active", viewIndex === stepNumber - 1);
      });

      $$(".step").forEach((step, stepIndex) => {
        step.classList.toggle("active", stepIndex < stepNumber);
        step.classList.toggle("backable", stepIndex < stepNumber - 1);
        step.disabled = stepIndex >= stepNumber - 1;

        step.querySelector("i").textContent =
          stepIndex < stepNumber - 1 ? "✓" : stepIndex + 1;
      });
    }

    function goBack(stepNumber) {
      if (stepNumber >= currentStep) return;

      clearTimeout(timer);
      playing = false;
      $("#actions").hidden = true;
      show(stepNumber);
    }

    function setTeamStyle() {
      document.documentElement.style.setProperty("--team", team[3]);
      document.documentElement.style.setProperty("--team2", team[4]);

      $$(".selectedLogo").forEach(element => {
        element.style.setProperty("--scale", team[6]);
      });

      $$(".selectedLogo img").forEach(image => {
        image.src = team[5];
      });
    }

    function chooseTeam(teamItem) {
      team = teamItem;
      setTeamStyle();
      show(2);
    }

    function chooseCount(number) {
      pickCount = number;

      candidates = Array.from(
        { length: number },
        () => ({
          name: "",
          org: "",
          customOrg: ""
        })
      );

      $("#countTitle").textContent = number;
      $("#pickLabel").textContent = `指名 ${number}名`;

      renderPlayers();
      show(3);

      setTimeout(() => {
        $("#players input").focus();
      }, 80);
    }

    function renderPlayers() {
      $("#players").innerHTML = candidates.map((candidate, candidateIndex) => `
        <div class="player">
          <div class="order">
            <b>${String(candidateIndex + 1).padStart(2, "0")}</b>
          </div>

          <label class="field orgfield">
            <span>所属団体</span>

            <select
              required
              data-i="${candidateIndex}"
              data-f="org"
            >
              <option
                value=""
                disabled
                ${candidate.org === "" ? "selected" : ""}
              >所属団体を選択</option>

              ${orgs.map(org => `
                <option ${org === candidate.org ? "selected" : ""}>
                  ${org}
                </option>
              `).join("")}
            </select>

            ${candidate.org === customOrg ? `
              <input
                class="customorg"
                data-i="${candidateIndex}"
                data-f="customOrg"
                maxlength="30"
                placeholder="所属団体を入力"
                aria-label="所属団体を自由入力"
                autocomplete="off"
              >
            ` : ""}
          </label>

          <label class="field">
            <span>選手名</span>

            <input
              data-i="${candidateIndex}"
              data-f="name"
              maxlength="30"
              placeholder="例：山田 太郎"
              autocomplete="off"
            >
          </label>
        </div>
      `).join("");

      $("#players").oninput = update;
      $("#players").onchange = update;
    }

    function update(event) {
      const candidateIndex = Number(event.target.dataset.i);
      const fieldName = event.target.dataset.f;

      if (!fieldName) return;

      candidates[candidateIndex][fieldName] = event.target.value;

      if (fieldName === "org") {
        const field = event.target.closest(".orgfield");
        const oldInput = field.querySelector(".customorg");

        if (event.target.value === customOrg && !oldInput) {
          const input = document.createElement("input");

          input.className = "customorg";
          input.dataset.i = candidateIndex;
          input.dataset.f = "customOrg";
          input.maxLength = 30;
          input.placeholder = "所属団体を入力";
          input.setAttribute("aria-label", "所属団体を自由入力");
          input.autocomplete = "off";

          field.appendChild(input);
          input.focus();
        } else if (event.target.value !== customOrg && oldInput) {
          oldInput.remove();
          candidates[candidateIndex].customOrg = "";
        }
      }

      $("#submit").disabled = !candidates.every(candidate =>
        candidate.name.trim() && orgName(candidate)
      );
    }

    function start() {
      clearTimeout(timer);

      index = 0;
      playing = true;
      sequence += 1;

      $("#actions").hidden = true;
      $("#editPlayers").hidden = true;

      show(4);
      renderIntro();
    }

    function bindAdvance() {
      const page = $(".manual");

      page.onclick = advance;

      page.onkeydown = event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          advance();
        }
      };
    }

    function advance() {
      if (!playing) return;

      if ($(".teamintro")) {
        renderReveal();
        return;
      }

      if (index < pickCount - 1) {
        index += 1;
        renderReveal();
        return;
      }

      playing = false;
      renderSummary();
      $("#actions").hidden = false;
    }

    function renderIntro() {
      $("#revealHost").innerHTML = `
        <div
          class="teamintro manual"
          role="button"
          tabindex="0"
        >
          <div class="topline"></div>
          <div class="live" role="img" aria-label="LIVE"></div>

          <div class="teamintrocopy">
            <h1>選択希望選手 発表</h1>
          </div>

          <div class="teamintrocenter">
            <span
              class="intrologo"
              style="--scale:${team[6] * 1.5}"
            >
              <img src="${team[5]}" alt="">
            </span>
          </div>

          <div class="clicknext">
            クリックして発表を開始
            <b>→</b>
          </div>
        </div>
      `;

      bindAdvance();
    }

    function renderReveal() {
      $("#editPlayers").hidden = true;

      const candidate = candidates[index];

      const dots = candidates.map((item, itemIndex) => `
        <button
          class="${
            itemIndex === index
              ? "on"
              : itemIndex < index
                ? "past"
                : ""
          }"
          ${playing ? "disabled" : ""}
          data-index="${itemIndex}"
        >
          <span>${itemIndex + 1}</span>
          <i></i>
        </button>
      `).join("");

      const hint =
        index < pickCount - 1
          ? "クリックして次の指名へ"
          : "クリックして指名一覧へ";

      $("#revealHost").innerHTML = `
        <div
          class="reveal ${playing ? "manual" : ""}"
          ${playing ? 'role="button" tabindex="0"' : ""}
          data-key="${sequence}-${index}"
        >
          <div class="topline"></div>

          <div class="meta">
            <p class="org">${orgName(candidate)}</p>
          </div>

          <div class="live" role="img" aria-label="LIVE"></div>

          <h1>${candidate.name.trim()}</h1>

          <div class="revealteam">
            <span
              class="reveallogo"
              style="--scale:${team[6] * 2}"
            >
              <img src="${team[5]}" alt="">
            </span>
          </div>

          <div class="track">${dots}</div>

          ${playing ? `
            <div class="clicknext">
              ${hint}
              <b>→</b>
            </div>
          ` : ""}
        </div>
      `;

      $$(".track button").forEach(button => {
        button.onclick = () => {
          if (!playing) {
            index = Number(button.dataset.index);
            renderReveal();
          }
        };
      });

      if (playing) bindAdvance();
    }

    function renderSummary() {
      $("#editPlayers").hidden = false;

      const cards = candidates.map((candidate, candidateIndex) => `
        <button
          class="summaryitem"
          data-index="${candidateIndex}"
        >
          <strong>
            ${String(candidateIndex + 1).padStart(2, "0")}
          </strong>

          <span>
            <small>${orgName(candidate)}</small>
            <b>${candidate.name.trim()}</b>
          </span>

          <em>個別表示 ↗</em>
        </button>
      `).join("");

      $("#revealHost").innerHTML = `
        <div class="summary">
          <div class="summaryhead">
            <div>
              <div class="eyebrow">DRAFT RESULT</div>
              <h1>指名選手一覧</h1>
            </div>

            <div class="summaryteam">
              <span
                class="summarylogo"
                style="--scale:${team[6]}"
              >
                <img src="${team[5]}" alt="">
              </span>
            </div>
          </div>

          <div class="summarygrid picks-${pickCount}">
            ${cards}
          </div>
        </div>
      `;

      $$(".summaryitem").forEach(button => {
        button.onclick = () => {
          index = Number(button.dataset.index);
          renderReveal();
        };
      });
    }

    function reset() {
      clearTimeout(timer);

      team = null;
      pickCount = 1;
      candidates = [];
      playing = false;

      customForm.querySelector("input").value = "";
      customForm.querySelector("button").disabled = true;

      $("#actions").hidden = true;
      show(1);
    }

    $("#form").onsubmit = event => {
      event.preventDefault();

      const completed = candidates.every(candidate =>
        candidate.name.trim() && orgName(candidate)
      );

      if (completed) start();
    };

    $$("[data-go]").forEach(button => {
      button.onclick = () => show(Number(button.dataset.go));
    });

    $$(".step").forEach(button => {
      button.onclick = () => goBack(Number(button.dataset.step));
    });

    $("#editPlayers").onclick = () => show(3);
    $("#replay").onclick = start;
    $("#restart").onclick = reset;
    $("#home").onclick = reset;
  </script>
</body>
</html>
